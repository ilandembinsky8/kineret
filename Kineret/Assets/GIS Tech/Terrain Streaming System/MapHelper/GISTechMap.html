          function CreateRectangleFromGDD() {

              if (!rectangle) {

                  if (!c_rectangle) {

                      var c_bounds = new google.maps.LatLngBounds(
                        new google.maps.LatLng(Coords.BottomRightCoordiante_y, Coords.UpperLeftCoordinate_x),
                        new google.maps.LatLng(Coords.UpperLeftCoordinate_y, Coords.BottomRightCoordiante_x)
                    );
                      c_rectangle = new google.maps.Rectangle({
                          strokeColor: "#FF0000",
                          strokeOpacity: 0.8,
                          strokeWeight: 2,
                          fillColor: "#FF0000",
                          fillOpacity: 0.1,
                          map,
                          bounds: c_bounds,
                          editable: true
                      });

                      c_rectangle.setMap(map);

                      // Add an event listener on the rectangle.
                      c_rectangle.addListener("bounds_changed", Init_bounds_changed);

                      var ne = c_bounds.getNorthEast();
                      var sw = c_bounds.getSouthWest();

                      $("#TLLat").text(ne.lat());
                      $("#TLLon").text(sw.lng());
                      $("#BRLat").text(sw.lat());
                      $("#BRLon").text(ne.lng());

                      var D2R = Math.PI / 180.0;
                      var R = 6371;

                      var scfY = Math.sin(ne.lat() * D2R);
                      var sctY = Math.sin(sw.lat() * D2R);
                      var ccfY = Math.cos(ne.lat() * D2R);
                      var cctY = Math.cos(sw.lat() * D2R);

                      var cX = Math.cos((sw.lng() - ne.lng()) * D2R);
                      var sizeX1 = Math.abs(R * Math.acos(scfY * scfY + ccfY * ccfY * cX));
                      var sizeX2 = Math.abs(R * Math.acos(sctY * sctY + cctY * cctY * cX));

                      sizeX = ((sizeX1 + sizeX2) / 2.0);
                      sizeY = (R * Math.acos(scfY * sctY + ccfY * cctY));

                      $("#AreaWidth").text(sizeX.toFixed(2));
                      $("#AreaHeight").text(sizeY.toFixed(2));
                      $("#AreaArea").text((sizeX * sizeY).toFixed(2));

                  }
              }

          }
          function Init_bounds_changed() {

          function UpdateInfo() {

              if (rectangle) {

                  if ((c_rectangle)) {

              $("#TLLon").text(sw.lng());
              $("#BRLat").text(sw.lat());
              $("#BRLon").text(ne.lng());

              var D2R = Math.PI / 180.0;
              var R = 6371;

              var scfY = Math.sin(ne.lat() * D2R);
              var sctY = Math.sin(sw.lat() * D2R);
              var ccfY = Math.cos(ne.lat() * D2R);
              var cctY = Math.cos(sw.lat() * D2R);

              var cX = Math.cos((sw.lng() - ne.lng()) * D2R);
              var sizeX1 = Math.abs(R * Math.acos(scfY * scfY + ccfY * ccfY * cX));
              var sizeX2 = Math.abs(R * Math.acos(sctY * sctY + cctY * cctY * cX));

              sizeX = ((sizeX1 + sizeX2) / 2.0);
              sizeY = (R * Math.acos(scfY * sctY + ccfY * cctY));

              $("#AreaWidth").text(sizeX.toFixed(2));
              $("#AreaHeight").text(sizeY.toFixed(2));
              $("#AreaArea").text((sizeX * sizeY).toFixed(2));

              $("div").removeClass("wrong");
              var wrong = false;

              if (!wrong) {
                  coordinates = '' + sw.lng() + ',' + sw.lat() + ',' + ne.lng() + ',' + ne.lat() + '';
              }
              else {
                  $("#coordNode").text("Wrong latitude");
              }


              if ($("#showgrid").prop("checked"))
              {
                  OnCalculateOptimizedInputers();

                  makeGrid();

              }

            
              }
          }
          function makeGrid() {

              for (x in rectangleLng) {
                  for (y in rectangleLng[x]) {
                      if (rectangleLng[x][y]) {
                          if (rectangleLng[x][y].setMap) {
                              rectangleLng[x][y].setMap(null)
                              rectangleLng[x][y] = null;
                          }
                      }
                  }
              }
 
              var bounds = rectangle.getBounds();

              var marker1 = bounds.getSouthWest();
              var marker2 = bounds.getNorthEast();

              var m1Lat = marker1.lat();
              var m1Lng = marker1.lng();
              var m2Lat = marker2.lat();
              var m2Lng = marker2.lng();

              var leftSideDist = m2Lng - m1Lng;
              var belowSideDist = m2Lat - m1Lat;

              var counts = OnCalculateOptimizedInputers();

              var dividerLat = counts.x;
              var dividerLng = counts.y;

              var excLat = belowSideDist / dividerLat;
              var excLng = leftSideDist / dividerLng;
 
              for (var i = 0; i < dividerLat; i++) {
                  if (!rectangleLng[i]) rectangleLng[i] = [];
                  for (var j = 0; j < dividerLng; j++) {
                      if (!rectangleLng[i][j]) rectangleLng[i][j] = {};

                      rectangleLng[i][j] = new google.maps.Rectangle({
                          strokeColor: '#FFFFFF',
                          strokeOpacity: 0.8,
                          strokeWeight: 2,
                          fillColor: '#FF0000',
                          fillOpacity: 0.1,
                          map: map,
                          bounds: new google.maps.LatLngBounds(
                          new google.maps.LatLng(m1Lat + (excLat * i), m1Lng + (excLng * j)),
                          new google.maps.LatLng(m1Lat + (excLat * (i + 1)), m1Lng + (excLng * (j + 1))))

                      });
                  }  
              }  
          }

          function OnCalculateOptimizedInputers()
          {
              var bounds = rectangle.getBounds();
              var ZoomLevel = $("#m_zoom_Level").find('option:selected').val();
                  var marker1 = bounds.getSouthWest();
                  var marker2 = bounds.getNorthEast();

                  var m1Lat = marker1.lat();
                  var m1Lng = marker1.lng();
                  var m2Lat = marker2.lat();
                  var m2Lng = marker2.lng();

                  var leftSideDist = m2Lng - m1Lng;
                  var belowSideDist = m2Lat - m1Lat;

                  var DL = new google.maps.Point(m1Lng, m2Lat);
                  var TR = new google.maps.Point(m2Lng, m1Lat);

                  var minpixelX, minpixelY, maxpixelX, maxpixelY;

                  var minXY = LatLongToPixelXY(m1Lat, m1Lng, ZoomLevel);
                  var maxXY = LatLongToPixelXY(m2Lat, m2Lng, ZoomLevel);

                  var Dimensions = OnCalSize();
 
                  var Totalwidth = maxXY.x - minXY.x;
                  var TotalHeight = minXY.y - maxXY.y;

                  var CountX = Totalwidth / 700;
                  var CountY = TotalHeight / 700;

                  if (CountX == 1 && Totalwidth > 1500) CountX = 2;
                  if (CountY == 1 && TotalHeight > 2500) CountY = 2;

                  if (CountX < 1)
                      CountX = 1;
                  if (CountY < 1)
                      CountY = 1;

                  $("#m_TilesCount").text("Tile Count : " + Math.round(CountX) + " x " + Math.round(CountY));

                  return new google.maps.Point(Math.round(CountX), Math.round(CountY));
          }

          function OnCalSize()
          {
              if (rectangle) {

                  var bounds = rectangle.getBounds();
                  var ne = bounds.getNorthEast();
                  var sw = bounds.getSouthWest();
              

              $("#TLLat").text(ne.lat());
              $("#TLLon").text(sw.lng());
              $("#BRLat").text(sw.lat());
              $("#BRLon").text(ne.lng());

              var D2R = Math.PI / 180.0;
              var R = 6371;

              var scfY = Math.sin(ne.lat() * D2R);
              var sctY = Math.sin(sw.lat() * D2R);
              var ccfY = Math.cos(ne.lat() * D2R);
              var cctY = Math.cos(sw.lat() * D2R);

              var cX = Math.cos((sw.lng() - ne.lng()) * D2R);
              var sizeX1 = Math.abs(R * Math.acos(scfY * scfY + ccfY * ccfY * cX));
              var sizeX2 = Math.abs(R * Math.acos(sctY * sctY + cctY * cctY * cX));

              sizeX = ((sizeX1 + sizeX2) / 2.0);
              sizeY = (R * Math.acos(scfY * sctY + ccfY * cctY));

              return new google.maps.Point(sizeX, sizeY);
              }
          }

          function OnClearGrid() {
              for (x in rectangleLng) {

          function CopyToClipboard() {

          function Clip(val, min, max) {
              if (val < min) return min;
              if (val > max) return max;
              return val;
          }

          function LatLngToTile(latLng, zoom) {
              var sy = Math.sin(latLng.lat() * Math.PI / 180);
              var lng = (latLng.lng() + 180) / 360;
              var lat = 0.5 - Math.log((1 + sy) / (1 - sy)) / (Math.PI * 4);
              var mapSize = tileSize * (1 << zoom);
              var px = lng * mapSize + 0.5;
              var py = lat * mapSize + 0.5;

              if (px < 0) px = 0;
              else if (px > mapSize - 1) px = mapSize - 1;
              if (py < 0) py = 0;
              else if (py > mapSize - 1) py = mapSize - 1;

              var tx = px / tileSize;
              var ty = py / tileSize;

              return new google.maps.Point(tx, ty);
          }

          function LatLongToPixelXY(latitude, longitude, levelOfDetail,pixelX,pixelY) {

              var latitude = Clip(latitude, MinLatitude, MaxLatitude);
              var longitude = Clip(longitude, MinLongitude, MaxLongitude);

              var x = (longitude + 180) / 360;
              var sinLatitude = Math.sin(latitude * Math.PI / 180);
              var y = 0.5 - Math.log((1 + sinLatitude) / (1 - sinLatitude)) / (4 * Math.PI);

              var mapSize = MapSize(levelOfDetail);
              pixelX = Clip(x * mapSize + 0.5, 0, mapSize - 1);
              pixelY = Clip(y * mapSize + 0.5, 0, mapSize - 1);

              return new google.maps.Point(pixelX, pixelY);
          } 

          function MapSize(levelOfDetail)
          {
      return 256 << levelOfDetail;
          }

          function OnChangeProvider() {

          }

          function OnKeyUp(event) {
              if (event.ctrlKey == 0) {
                  if (m_rectangle) m_rectangle.setDraggable(false);
                  for (i = 0; i < rectangleLng; i++) rectangleLng[i].setDraggable(false);
              }
          }

          function OnToggleGrid() {
              if ($("#showgrid").prop("checked")) {

                  UpdateInfo();

              }
              else {

              }
              
          }

          function Repeat(value, minValue, maxValue) {
              var range = maxValue - minValue;
              while (value < minValue || value > maxValue) {
                  if (value < minValue) value += range;
                  else value -= range;
              }
              return value;
          }
 
          function Search() {
              geocoder.geocode({ 'address': $("#search-address").val() },
                  function (results, status) {
                      if (status == google.maps.GeocoderStatus.OK) {
                          var loc = results[0].geometry.location;
                          map.panTo(loc);
                      }
                      else {
                          alert("Not found: " + status);
                      }
                  }
              );
          }

 

          function TileToLatLng(tilePos, zoom) {
              var mapSize = tileSize << zoom;
              var lng = 360 * (Repeat(tilePos.x * tileSize, 0, mapSize - 1) / mapSize - 0.5);
              var lat = 90 - 360 * Math.atan(Math.exp((Clip(tilePos.y * tileSize, 0, mapSize - 1) / mapSize - 0.5) * Math.PI * 2)) / Math.PI;
              return new google.maps.LatLng(lat, lng);
          }
